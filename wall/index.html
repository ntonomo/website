    body {
      margin: 0;

      font-weight: bold;
      font-style: italic;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;

      padding: 20px;
      box-sizing: border-box;
    }

    :root {
      --size: min(150px, 12vw);
      --gap: calc(var(--size) * 0.2);
    }

    .wall {
      display: grid;
      grid-template-columns: repeat(7, var(--size));
      grid-auto-rows: var(--size);
      gap: var(--gap);
    }

    .wall img.album {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

.mrrow {
  grid-column: 6;
  grid-row: 3;

  display: flex;
  align-items: end;
  justify-content: center;
}

.mrrow img {
  height: 66%;
  width: auto;
  object-fit: contain;
      image-rendering: pixelated;

}

    .back-button {
      position: fixed;
      bottom: 20px;
      left: 20px;

      text-decoration: none;
      color: white;
      font-size: 24px;
    }

    @media (max-width: 600px) {
      :root {
        --size: min(120px, 18vw);
      }

      .back-button {
        font-size: 20px;
      }
    }
  </style>
