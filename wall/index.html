  <style>
    body {
      margin: 0;
      background-color: #ffa667;

      font-family: Helvetica, Arial, sans-serif;
      font-weight: bold;
      font-style: italic;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wall {
      display: grid;
      grid-template-columns: repeat(7, 150px);
      grid-template-rows: repeat(3, 150px);
      gap: 30px;
    }

    .wall img.album {
      width: 150px;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .mrrow {
      grid-column: 6 / 8;
      grid-row: 3;

      display: flex;
      justify-content: flex-start; /* left */
      align-items: flex-end;       /* bottom */
    }

    .mrrow img {
      height: 90px;
      width: auto;
      object-fit: contain;
    }

.back-button {
  position: fixed;
  bottom: 25px;
  left: 25px;

  text-decoration: none;
  color: white;

font-size: 30px;
}

  </style>
