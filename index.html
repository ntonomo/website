<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="/favicon.png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #ffa667;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: bold;
      font-style: italic;
    }

    a {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 48px;
      line-height: 1.8;
    }

    .sprites {
      position: fixed;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }

    .sprites a {
      display: inline-block;
    }

    .sprites img {
      height: 80px;
      width: auto;
      image-rendering: pixelated;
      display: block;
    }
  </style>
</head>

<body>
  <div>
